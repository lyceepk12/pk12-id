<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>PK12 ID</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1b2d;--card:#172740;--line:#2a3f5f;--tx:#eef3fa;--mut:#8fa3bf;--acc:#ffc83d;--ok:#3ddc97;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Bricolage Grotesque",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.5px}
h1 b{background:var(--acc);color:var(--bg);padding:1px 8px;border-radius:6px;margin-right:6px}
nav{display:flex;gap:6px;padding:0 16px 12px}
nav button{flex:1;padding:10px;border:1px solid var(--line);background:none;color:var(--mut);border-radius:10px;font:inherit;font-weight:600}
nav button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
main{padding:0 16px 32px;max-width:640px;margin:auto}
section{display:none}section.on{display:block}
label{display:block;color:var(--mut);font-size:14px;margin:12px 0 4px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--bg);font:inherit;font-weight:800;font-size:17px}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/4}
.cam video,.cam canvas{width:100%;height:100%;object-fit:cover;display:block}
.cam canvas{position:absolute;inset:0}
.id{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:14px;padding:12px;margin-top:12px}
.id.no{border-left-color:var(--bad)}
.id img{width:84px;height:104px;object-fit:cover;border-radius:8px;background:#0006}
.id h2{margin:0;font-size:20px}.id p{margin:2px 0;color:var(--mut)}
.id .c{display:inline-block;background:var(--acc);color:var(--bg);font-weight:800;border-radius:6px;padding:0 8px}
#log{max-height:260px;overflow:auto;font-size:14px;color:var(--mut);margin-top:12px}
#log div{padding:3px 0}#log .ok{color:var(--ok)}#log .er{color:var(--bad)}
.msg{color:var(--mut);margin:10px 0}
.small{font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<header><h1><b>PK12</b>ID</h1><span class="small" id="stat">Chargement…</span></header>

<!-- Connexion -->
<main id="auth" style="display:none">
  <p class="msg">Connectez-vous avec le compte enseignant créé dans Supabase.</p>
  <label>URL Supabase</label><input id="url" placeholder="https://xxxx.supabase.co">
  <label>Clé anon (publique)</label><input id="key">
  <label>Email</label><input id="mail" type="email" autocomplete="username">
  <label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" id="login">Se connecter</button>
  <p class="msg" id="aerr"></p>
</main>

<!-- App -->
<div id="app" style="display:none">
<nav><button data-t="scan" class="on">Scanner</button><button data-t="imp">Importer</button></nav>
<main>
  <section id="scan" class="on">
    <div class="cam"><video id="vid" playsinline muted></video><canvas id="ov"></canvas></div>
    <button class="btn" id="snap">Capturer et identifier</button>
    <button class="btn alt" id="flip">Changer de caméra</button>
    <div id="res"></div>
  </section>

  <section id="imp">
    <p class="msg">Nommez chaque photo avec le nom de l'élève, ex. <b>Dupont_Marie.jpg</b>. Une classe à la fois.</p>
    <label>Classe</label><input id="cls" placeholder="ex. 2nde A">
    <label>Photos des élèves</label><input id="files" type="file" accept="image/*" multiple>
    <button class="btn" id="go">Importer la classe</button>
    <div id="log"></div>
  </section>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<script>
const $=s=>document.querySelector(s);
const MODELS='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model';
const THRESHOLD=0.5, BUCKET='photos';
let sb,matcher,students=[],facing='user',stream;

// ---------- Démarrage ----------
(async()=>{
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  const u=localStorage.pk_url,k=localStorage.pk_key;
  if(!u||!k){showAuth();return}
  sb=supabase.createClient(u,k);
  const {data}=await sb.auth.getSession();
  data.session?startApp():showAuth();
})();
function showAuth(){$('#auth').style.display='block';$('#stat').textContent='Hors session';
  $('#url').value=localStorage.pk_url||'';$('#key').value=localStorage.pk_key||''}
$('#login').onclick=async()=>{
  localStorage.pk_url=$('#url').value.trim();localStorage.pk_key=$('#key').value.trim();
  sb=supabase.createClient(localStorage.pk_url,localStorage.pk_key);
  const {error}=await sb.auth.signInWithPassword({email:$('#mail').value,password:$('#pw').value});
  if(error){$('#aerr').textContent='Connexion impossible : '+error.message;return}
  $('#auth').style.display='none';startApp();
};
async function startApp(){
  $('#app').style.display='block';$('#stat').textContent='Chargement des modèles…';
  await Promise.all([faceapi.nets.ssdMobilenetv1.loadFromUri(MODELS),faceapi.nets.faceLandmark68Net.loadFromUri(MODELS),faceapi.nets.faceRecognitionNet.loadFromUri(MODELS)]);
  await loadStudents();startCam();
}
async function loadStudents(){
  students=[];
  for(let from=0;;from+=1000){
    const {data,error}=await sb.from('students').select('id,full_name,class_name,photo_path,descriptor').range(from,from+999);
    if(error||!data.length)break;students.push(...data);if(data.length<1000)break;
  }
  matcher=students.length?new faceapi.FaceMatcher(students.map(s=>new faceapi.LabeledFaceDescriptors(s.id,[new Float32Array(s.descriptor)])),THRESHOLD):null;
  $('#stat').textContent=students.length+' élèves';
}

// ---------- Onglets ----------
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button,section').forEach(e=>e.classList.remove('on'));
  b.classList.add('on');$('#'+b.dataset.t).classList.add('on');
  b.dataset.t==='scan'?startCam():stopCam();
});

// ---------- Caméra ----------
async function startCam(){
  stopCam();
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280}},audio:false});
    $('#vid').srcObject=stream;await $('#vid').play()}
  catch(e){$('#res').innerHTML='<p class="msg">Caméra inaccessible. Autorisez-la dans le navigateur.</p>'}
}
function stopCam(){stream&&stream.getTracks().forEach(t=>t.stop())}
$('#flip').onclick=()=>{facing=facing==='user'?'environment':'user';startCam()};

$('#snap').onclick=async()=>{
  const v=$('#vid'),res=$('#res');
  if(!matcher){res.innerHTML='<p class="msg">Aucun élève en base. Importez d\'abord une classe.</p>';return}
  res.innerHTML='<p class="msg">Analyse…</p>';
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
  const found=await faceapi.detectAllFaces(c).withFaceLandmarks().withFaceDescriptors();
  const ov=$('#ov');ov.width=c.width;ov.height=c.height;const g=ov.getContext('2d');g.clearRect(0,0,ov.width,ov.height);
  if(!found.length){res.innerHTML='<p class="msg">Aucun visage détecté. Rapprochez-vous et éclairez le visage.</p>';return}
  res.innerHTML='';
  for(const f of found){
    const m=matcher.findBestMatch(f.descriptor),ok=m.label!=='unknown',b=f.detection.box;
    g.strokeStyle=ok?'#3ddc97':'#ff6b6b';g.lineWidth=4;g.strokeRect(b.x,b.y,b.width,b.height);
    if(!ok){res.insertAdjacentHTML('beforeend','<div class="id no"><div><h2>Non reconnu</h2><p>Aucune correspondance dans la base.</p></div></div>');continue}
    const s=students.find(x=>x.id===m.label),pct=Math.round((1-m.distance)*100);
    const {data}=await sb.storage.from(BUCKET).createSignedUrl(s.photo_path,300);
    res.insertAdjacentHTML('beforeend',`<div class="id"><img src="${data?.signedUrl||''}" alt=""><div><h2>${esc(s.full_name)}</h2><p>Classe : ${esc(s.class_name)}</p><span class="c">${pct}%</span></div></div>`);
  }
  setTimeout(()=>g.clearRect(0,0,ov.width,ov.height),2500);
};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- Import par classe ----------
const log=(t,c)=>{const d=document.createElement('div');d.textContent=t;d.className=c||'';$('#log').prepend(d)};
const nameFrom=f=>f.name.replace(/\.[^.]+$/,'').replace(/[_\-]+/g,' ').replace(/\s+/g,' ').trim();
$('#go').onclick=async()=>{
  const cls=$('#cls').value.trim(),files=[...$('#files').files];
  if(!cls||!files.length){log('Indiquez la classe et choisissez des photos.','er');return}
  $('#go').disabled=true;$('#log').innerHTML='';let n=0;
  const safeCls=cls.replace(/[^\w\-]+/g,'_');
  for(const f of files){
    const name=nameFrom(f);
    try{
      const img=await faceapi.bufferToImage(f);
      const d=await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
      if(!d){log(name+' : aucun visage détecté','er');continue}
      const path=`${safeCls}/${name.replace(/[^\w\-]+/g,'_')}_${Date.now()}.jpg`;
      const up=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type||'image/jpeg'});
      if(up.error)throw up.error;
      const ins=await sb.from('students').insert({full_name:name,class_name:cls,photo_path:path,descriptor:Array.from(d.descriptor)});
      if(ins.error)throw ins.error;
      n++;log(name+' : importé','ok');
    }catch(e){log(name+' : '+(e.message||e),'er')}
  }
  log(`Terminé : ${n}/${files.length} élèves importés.`,'ok');
  $('#go').disabled=false;await loadStudents();
};
</script>
</body>
</html>
